services:
  _defaults:
    autowire: true

  plugin.manager.scanner:
    class: Drupal\scanner\Plugin\ScannerPluginManager
    parent: default_plugin_manager

  scanner.word_boundaries_helper:
    class: Drupal\scanner\WordBoundariesHelper
    arguments: ['@database', '@config.factory']

  Drupal\scanner\Hook\ScannerQueryHooks:
    class: Drupal\scanner\Hook\ScannerQueryHooks

  Drupal\scanner\Hook\ScannerThemeHooks:
    class: Drupal\scanner\Hook\ScannerThemeHooks
